<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0" />
  <meta name="description" content="Adapt — An intelligent, adaptive study planner with automated timeline scheduling, lost-time recovery, and academic goal tracking." />
  <meta name="theme-color" content="#070b14" />
  <title>Adapt — Adaptive Study Planner</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
  <link rel="manifest" href="manifest.json" />
</head>
<body>
  <div id="app"></div>
  <script type="module" src="app.js"></script>
  <script>
    // Fallback: If index.html is opened directly via file:// in a browser without a web server,
    // modern browsers block type="module" due to CORS. In that scenario, load app.js as a regular script.
    if (window.location.protocol === 'file:') {
      const s = document.createElement('script');
      s.src = 'app.js';
      document.body.appendChild(s);
    }
    if ('serviceWorker' in navigator && window.location.protocol !== 'file:') {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').then(reg => {
          reg.update();
        }).catch(err => {
          console.log('ServiceWorker registration failed: ', err);
        });
      });
    }
  </script>
</body>
</html>
